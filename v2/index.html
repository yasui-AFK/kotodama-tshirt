<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>言霊 · Kotodama — Discover the Spirit of Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #f5ecdf; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Legacy data + dictionaries (loaded before prototype data) -->
  <script src="data/legacy-data.js"></script>
  <script src="data/name-dictionary.js"></script>
  <script src="data/kotodama-deep-meanings.js"></script>

  <!-- Prototype core -->
  <script src="kotodama-data.js"></script>

  <!-- Bridge: overrides romanizeName/readName, merges KOTODAMA -->
  <script src="data-bridge.js"></script>

  <!-- React components -->
  <script type="text/babel" src="kotodama-visuals.jsx"></script>
  <script type="text/babel" src="brush-writer.jsx"></script>
  <script type="text/babel" src="kotodama-screens.jsx"></script>
  <script type="text/babel" src="kotodama-app.jsx"></script>

  <script type="text/babel">
    function App() {
      const theme = window.KT_THEMES.sakura;
      return <window.KotodamaApp theme={theme} initialScreen="landing"/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
