<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>言霊 · Kotodama — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #f6f1e7; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root" data-screen-label="Kotodama Prototype"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="kotodama-data.js"></script>
  <script type="text/babel" src="kotodama-visuals.jsx"></script>
  <script type="text/babel" src="brush-writer.jsx"></script>
  <script type="text/babel" src="kotodama-screens.jsx"></script>
  <script type="text/babel" src="kotodama-app.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "sakura"
    }/*EDITMODE-END*/;

    function App() {
      const [themeKey, setThemeKey] = useState(TWEAK_DEFAULTS.theme);
      const theme = window.KT_THEMES[themeKey] || window.KT_THEMES.sumie;

      React.useEffect(() => {
        const onMsg = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') document.getElementById('tweaks').style.display = 'block';
          if (e.data.type === '__deactivate_edit_mode') document.getElementById('tweaks').style.display = 'none';
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({type: '__edit_mode_available'}, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTheme = (k) => {
        setThemeKey(k);
        window.parent.postMessage({type: '__edit_mode_set_keys', edits: { theme: k }}, '*');
      };

      return (
        <div>
          <window.KotodamaApp theme={theme} initialScreen="landing"/>
          <div id="tweaks" style={{
            display: 'none', position: 'fixed', bottom: 20, right: 20, zIndex: 1000,
            background: '#fff', padding: 16, borderRadius: 8, boxShadow: '0 8px 28px rgba(0,0,0,0.18)',
            fontFamily: 'Inter, sans-serif', fontSize: 12,
          }}>
            <div style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase',
                          color: '#666', marginBottom: 10 }}>Tweaks · Visual Direction</div>
            {Object.entries(window.KT_THEMES).map(([k, t]) => (
              <button key={k} onClick={() => setTheme(k)} style={{
                display: 'block', width: '100%', padding: '8px 12px', marginBottom: 6,
                background: themeKey === k ? '#15130f' : 'transparent',
                color: themeKey === k ? '#fff' : '#15130f',
                border: '1px solid ' + (themeKey === k ? '#15130f' : '#ddd'),
                cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit', fontSize: 12,
              }}>{t.name}</button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
